 <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIGC</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Tahoma, sans-serif;
      background: #f3f6fb;
      color: #172554;
    }
    main {
      text-align: center;
      padding: 48px 24px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 40px #17255412;
      max-width: 500px;
      width: calc(100% - 32px);
    }
    h1 { font-size: 36px; margin-bottom: 12px; }
    p { color: #64748b; line-height: 2; }
  </style>
</head>
<body>
  <main>
    <h1>به NIGC خوش آمدید</h1>
    <p>صفحه وب با موفقیت راه‌اندازی شد.</p>
  </main>
</body>
</html>
